<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Multi-chart trading workspace built on TradingView charts.">
<meta name="theme-color" content="#0B0E14">
<title>Trading Charts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0E14'/%3E%3Crect x='8' y='11' width='4' height='13' fill='%232EBD85'/%3E%3Crect x='9.2' y='7' width='1.6' height='19' fill='%232EBD85'/%3E%3Crect x='19' y='8' width='4' height='11' fill='%23F0616D'/%3E%3Crect x='20.2' y='5' width='1.6' height='18' fill='%23F0616D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://s3.tradingview.com" crossorigin>
<link rel="preconnect" href="https://s.tradingview.com" crossorigin>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   Design system
   ───────────────────────────────────────────────────────────────────────
   A trading terminal is read, not browsed. Three rules drive every choice:

   1. Numbers must never jitter. Everything numeric is set in a monospace
      face with tabular figures, so a price ticking 313.29 -> 313.30 does
      not shift the layout by a hair.
   2. Green and red are reserved for direction. Nothing decorative may use
      them, or the eye stops trusting them. The accent is amber, which is
      why it can safely mean "session / live / now" without ever colliding
      with up and down.
   3. The base is blue-black, not pure black. Pure black crushes candle
      wicks on OLED and makes the grid disappear; #0B0E14 keeps a hairline
      readable at 1px.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* surfaces, darkest to lightest */
  --bg:        #0B0E14;
  --surface:   #121722;
  --raised:    #1A2130;
  --hover:     #222B3D;

  /* hairlines */
  --line:      #212A3A;
  --line-soft: #171E2B;

  /* text */
  --text:      #DFE6F1;
  --muted:     #7C8AA5;
  --dim:       #4C5A73;

  /* direction — never used decoratively */
  --up:        #2EBD85;
  --down:      #F0616D;
  --up-soft:   rgba(46, 189, 133, .14);
  --down-soft: rgba(240, 97, 109, .14);

  /* the one accent: session, live, now */
  --accent:    #E8B34A;
  --accent-soft: rgba(232, 179, 74, .13);

  /* session ribbon segments */
  --pre:       #4B7BE5;
  --post:      #9B6BD6;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
          system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", "Roboto Mono",
          Menlo, Consolas, monospace;

  --r:   6px;
  --r-lg: 10px;
  --ease: cubic-bezier(.32, .72, 0, 1);
  --shadow: 0 12px 32px -8px rgba(0, 0, 0, .7), 0 0 0 1px var(--line);

  --header-h: 46px;
  --rail-w:   44px;
  --strip-h:  26px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* The `hidden` attribute only sets display:none in the UA sheet, so any
   author rule that sets display (.filters is a grid, .ribbon is a block)
   silently overrides it and the element stays on screen. */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body { display: flex; flex-direction: column; }

/* Every number in the app. Tabular figures are the whole point. */
.num, .price, input[type="number"] {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
  letter-spacing: -.01em;
}

/* Small caps labelling, used for anything that names a control or a field. */
.label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--dim);
}

::selection { background: var(--accent-soft); color: var(--text); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-radius: 3px;
}

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--raised); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--hover); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ═══ Controls ═══════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 9px;
  background: transparent; border: 1px solid transparent; border-radius: var(--r);
  color: var(--muted); font: inherit; font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap;
  transition: background .12s var(--ease), color .12s var(--ease), border-color .12s var(--ease);
}
.btn:hover { background: var(--raised); color: var(--text); }
.btn.on { background: var(--accent-soft); color: var(--accent); border-color: rgba(232, 179, 74, .28); }
.btn:disabled { opacity: .38; cursor: default; }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.btn-primary {
  background: var(--accent); color: #17130A; border-color: var(--accent); font-weight: 600;
}
.btn-primary:hover { background: #F2C264; color: #17130A; }

.field {
  height: 28px; padding: 0 8px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r);
  color: var(--text); font: inherit; font-size: 12px;
  transition: border-color .12s var(--ease);
}
.field:focus { outline: none; border-color: var(--accent); }
.field::placeholder { color: var(--dim); }
select.field { cursor: pointer; }

.sep { width: 1px; height: 18px; background: var(--line); flex: none; margin: 0 3px; }

/* ═══ Header ═════════════════════════════════════════════════════════ */
#header {
  height: var(--header-h); flex: none;
  display: flex; align-items: center; gap: 4px; padding: 0 10px 0 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 40;
}

.brand {
  display: flex; align-items: center; gap: 8px;
  margin-right: 6px; user-select: none;
}
.brand-mark { width: 17px; height: 17px; flex: none; }
.brand-name {
  font-size: 13px; font-weight: 650; letter-spacing: -.02em; color: var(--text);
}

.layouts { display: flex; gap: 1px; background: var(--bg); padding: 2px; border-radius: var(--r); }
.layouts .btn { height: 24px; width: 26px; padding: 0; justify-content: center; }
.layouts .btn svg { width: 13px; height: 13px; stroke-width: 1.4; }

#header .spacer { flex: 1; }

/* Market state pill: the only place the accent appears in the header. */
.market-state {
  display: flex; align-items: center; gap: 7px;
  height: 26px; padding: 0 10px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 13px;
  font-size: 11px; font-weight: 550; color: var(--muted);
}
.market-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex: none;
}
.market-state[data-state="open"]  .market-dot { background: var(--up); box-shadow: 0 0 0 3px var(--up-soft); animation: pulse 2.4s var(--ease) infinite; }
.market-state[data-state="pre"]   .market-dot { background: var(--pre); box-shadow: 0 0 0 3px rgba(75,123,229,.16); }
.market-state[data-state="post"]  .market-dot { background: var(--post); box-shadow: 0 0 0 3px rgba(155,107,214,.16); }
.market-state[data-state="open"]  { color: var(--text); }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }

/* ═══ Workspace ══════════════════════════════════════════════════════ */
#grid {
  flex: 1; display: grid; gap: 1px; background: var(--line-soft); min-height: 0; min-width: 0;
}
#grid[data-layout="1"] { grid-template: 1fr / 1fr; }
#grid[data-layout="2"] { grid-template: 1fr / 1fr 1fr; }
#grid[data-layout="2v"] { grid-template: 1fr 1fr / 1fr; }
#grid[data-layout="3"] { grid-template: 1fr 1fr / 1fr 1fr; }
#grid[data-layout="3"] .cell:first-child { grid-row: span 2; }
#grid[data-layout="4"] { grid-template: 1fr 1fr / 1fr 1fr; }
#grid[data-layout="6"] { grid-template: 1fr 1fr / repeat(3, 1fr); }

/* ═══ Chart cell ═════════════════════════════════════════════════════ */
.cell {
  display: flex; flex-direction: column; background: var(--bg);
  min-width: 0; min-height: 0; position: relative;
  transition: box-shadow .15s var(--ease);
}
.cell.active { box-shadow: inset 0 0 0 1px rgba(232, 179, 74, .3); }
#grid[data-layout="1"] .cell.active { box-shadow: none; }

/* — toolbar: symbol only; everything else belongs to the widget — */
.cell-bar {
  height: 32px; flex: none;
  display: flex; align-items: center; gap: 4px; padding: 0 6px 0 8px;
  border-bottom: 1px solid var(--line-soft);
}
.cell-bar .spacer { flex: 1; }
.cell-hint { font-size: 11px; color: var(--dim); }
.cell-chart { flex: 1; min-height: 0; position: relative; }
.chart-mount { position: absolute; inset: 0; }
/* The widget paints its own background; this stops a white flash while the
   iframe loads. */
.chart-mount iframe { border: 0; background: var(--bg); }
.panel-body.embed { padding: 0; overflow: hidden; }
.panel-body.embed .tradingview-widget-container { height: 100%; }
.group-label { padding: 12px 12px 4px; }
.sym-input {
  width: 82px; height: 24px; padding: 0 6px;
  background: transparent; border: 1px solid transparent; border-radius: 4px;
  color: var(--text); font-family: var(--sans);
  font-size: 13px; font-weight: 650; letter-spacing: -.01em; text-transform: uppercase;
}
.sym-input:hover { background: var(--raised); }
.sym-input:focus { outline: none; background: var(--bg); border-color: var(--accent); }



.last-price {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 13px; font-weight: 600; letter-spacing: -.02em;
  padding: 2px 6px; border-radius: 4px;
  transition: background .35s var(--ease);
}
.last-price.up { color: var(--up); }
.last-price.down { color: var(--down); }
.last-price.flash-up { background: var(--up-soft); transition: background 0s; }
.last-price.flash-down { background: var(--down-soft); transition: background 0s; }

.chg-badge {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 11px; font-weight: 600; padding: 2px 5px; border-radius: 4px;
}
.chg-badge.up { color: var(--up); background: var(--up-soft); }
.chg-badge.down { color: var(--down); background: var(--down-soft); }

/* ═══ Panels ═════════════════════════════════════════════════════════ */
#panel-layer {
  position: fixed; top: var(--header-h); right: 0; bottom: 0; left: 0;
  overflow: hidden; pointer-events: none; z-index: 30;
}
.panel {
  position: absolute; top: 0; bottom: 0; right: 0; width: 340px;
  display: flex; flex-direction: column; pointer-events: auto;
  background: var(--surface); border-left: 1px solid var(--line);
  transform: translateX(100%);
  box-shadow: -16px 0 40px -20px rgba(0, 0, 0, .8);
  /* visibility flips only after the slide-out finishes, so a closing panel
     still animates but a closed one is skipped by focus and screen readers. */
  visibility: hidden;
  transition: transform .24s var(--ease), visibility 0s linear .24s;
}
.panel.open { transform: none; visibility: visible; transition: transform .24s var(--ease), visibility 0s; }
/* The screener needs room for its columns, or they clip. */
.panel.wide { width: min(660px, 94vw); }
.panel-head {
  height: 40px; flex: none; display: flex; align-items: center; gap: 8px;
  padding: 0 8px 0 14px; border-bottom: 1px solid var(--line);
}
.panel-title { font-size: 12px; font-weight: 650; letter-spacing: -.01em; flex: 1; }
.panel-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.panel-foot { flex: none; padding: 8px 10px; border-top: 1px solid var(--line); display: flex; gap: 6px; }

.tabs { display: flex; gap: 1px; padding: 6px 10px; border-bottom: 1px solid var(--line-soft); }
.tab {
  flex: 1; height: 25px; background: transparent; border: none; border-radius: 4px;
  color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
}
.tab:hover { background: var(--raised); color: var(--text); }
.tab.on { background: var(--raised); color: var(--accent); }

.row {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  border-bottom: 1px solid var(--line-soft); cursor: pointer;
  transition: background .1s var(--ease);
}
.row:hover { background: var(--raised); }
.row-main { flex: 1; min-width: 0; }
.row-sym { font-size: 12px; font-weight: 650; letter-spacing: -.01em; }
.row-name { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-right { text-align: right; flex: none; }
.row-px { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; }
.row-chg { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; }
.row-chg.up { color: var(--up); } .row-chg.down { color: var(--down); }
.row-del {
  width: 20px; height: 20px; display: grid; place-items: center; flex: none;
  background: none; border: none; color: var(--dim); cursor: pointer; border-radius: 4px; opacity: 0;
}
.row:hover .row-del { opacity: 1; }
.row-del:hover { color: var(--down); background: var(--hover); }
.row-del svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.empty {
  padding: 32px 20px; text-align: center; color: var(--dim); font-size: 12px; line-height: 1.6;
}

/* ═══ Search overlay ═════════════════════════════════════════════════ */
#search-overlay {
  position: fixed; inset: 0; z-index: 60; display: none;
  background: rgba(6, 8, 13, .72); backdrop-filter: blur(3px);
  align-items: flex-start; justify-content: center; padding-top: 14vh;
}
#search-overlay.open { display: flex; }
.search-box {
  width: min(520px, 92vw); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden;
  animation: rise .18s var(--ease);
}
@keyframes rise { from { opacity: 0; transform: translateY(-8px) } }
.search-box input {
  width: 100%; height: 46px; padding: 0 16px;
  background: transparent; border: none; border-bottom: 1px solid var(--line);
  color: var(--text); font: inherit; font-size: 15px;
}
.search-box input:focus { outline: none; }
.search-results { max-height: 46vh; overflow-y: auto; }
.search-results .row.sel { background: var(--raised); }
.search-hint {
  padding: 7px 14px; font-size: 11px; color: var(--dim);
  border-top: 1px solid var(--line-soft); display: flex; gap: 12px;
}
kbd {
  font-family: var(--mono); font-size: 10px; padding: 1px 4px;
  background: var(--raised); border: 1px solid var(--line); border-radius: 3px; color: var(--muted);
}

/* ═══ Toast ══════════════════════════════════════════════════════════ */
#toasts {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 80; display: flex; flex-direction: column; gap: 6px; align-items: center;
  pointer-events: none;
}
.toast {
  padding: 8px 14px; background: var(--raised); border: 1px solid var(--line);
  border-radius: var(--r); font-size: 12px; color: var(--text); box-shadow: var(--shadow);
  animation: toast-in .2s var(--ease);
}
.toast.error { border-color: rgba(240, 97, 109, .4); color: var(--down); }
.toast.ok { border-color: rgba(46, 189, 133, .35); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px) } }

/* ═══ Responsive ═════════════════════════════════════════════════════ */
@media (max-width: 900px) {
  .panel, .panel.wide { width: 100%; }
  .brand-name, .layouts { display: none; }
  /* These have equivalents in Settings; drop them rather than let the header
     overflow and clip the market state. */
  #btn-prepost, #btn-fit, #header .sep { display: none; }
  #btn-search span, #btn-search kbd { display: none; }
  #grid[data-layout] { grid-template: 1fr / 1fr; }
  #grid .cell:not(.active) { display: none; }
}
@media (max-width: 600px) {
  /* Only the timeframe strip scrolls; symbol and price stay pinned so the
     last price is never the thing that gets clipped. */
  .cell-bar { overflow: visible; gap: 2px; padding-right: 8px; }
  .cell-bar .spacer { display: none; }
    .tf-group::-webkit-scrollbar { display: none; }
  .sym-input { width: 68px; flex: none; }
  .chg-badge { display: none; }
  .readout { top: 44px; }
  .brand { margin-right: 2px; }
}
</style>
</head>

</defs></svg>

<!-- ═══ Header ═════════════════════════════════════════════════════ -->
<header id="header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="8" y="11" width="4" height="13" fill="#2EBD85"/><rect x="9.2" y="7" width="1.6" height="19" fill="#2EBD85"/>
      <rect x="19" y="8" width="4" height="11" fill="#F0616D"/><rect x="20.2" y="5" width="1.6" height="18" fill="#F0616D"/>
    </svg>
    <span class="brand-name">Trading Charts</span>
  </div>

  <div class="layouts" id="layouts" role="group" aria-label="Grid layout">
    <button class="btn on" data-layout="1"  title="Single chart"><svg viewBox="0 0 16 16"><use href="#i-l1"/></svg></button>
    <button class="btn"    data-layout="2"  title="Two columns"><svg viewBox="0 0 16 16"><use href="#i-l2"/></svg></button>
    <button class="btn"    data-layout="2v" title="Two rows"><svg viewBox="0 0 16 16"><use href="#i-l2v"/></svg></button>
    <button class="btn"    data-layout="3"  title="Three charts"><svg viewBox="0 0 16 16"><use href="#i-l3"/></svg></button>
    <button class="btn"    data-layout="4"  title="Four charts"><svg viewBox="0 0 16 16"><use href="#i-l4"/></svg></button>
    <button class="btn"    data-layout="6"  title="Six charts"><svg viewBox="0 0 16 16"><use href="#i-l6"/></svg></button>
  </div>

  <div class="sep"></div>
  <button class="btn" id="btn-search"><svg viewBox="0 0 16 16"><use href="#i-search"/></svg><span>Symbol</span><kbd>/</kbd></button>
  <button class="btn" id="btn-sync" title="Put the active symbol on every chart"><svg viewBox="0 0 16 16"><use href="#i-sync"/></svg><span>Sync all</span></button>

  <div class="spacer"></div>

  <button class="btn icon" id="btn-watchlist" title="Watchlist"><svg viewBox="0 0 16 16"><use href="#i-star"/></svg></button>

<!-- ═══ Panels ═════════════════════════════════════════════════════ -->

<!-- ═══ Symbol search ══════════════════════════════════════════════ -->
<div id="search-overlay" role="dialog" aria-modal="true" aria-label="Symbol search">
  <div class="search-box">
    <input id="search-input" placeholder="Symbol — AAPL, NASDAQ:TSLA, BINANCE:BTCUSDT" autocomplete="off" spellcheck="false">
    <div class="search-results" id="search-results"></div>
    <div class="search-hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> pick</span><span><kbd>⏎</kbd> load</span><span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   APP — a multi-chart workspace around TradingView's embedded widgets
   ───────────────────────────────────────────────────────────────────────
   Each cell holds a TradingView Advanced Chart widget, so the candles, the
   indicator library, the drawing tools and the data are all theirs — served
   and licensed by them. What this app adds is what their free embed does
   not: several charts side by side, a watchlist that drives them, symbol
   search, saved layouts and keyboard control.

   One consequence worth knowing: the widget is a cross-origin iframe, so
   nothing inside it can be read back. Symbols are therefore driven from here
   and a change is applied by rebuilding the widget. Anything changed inside
   the chart — interval, indicators, drawings — is TradingView's to keep and
   is not part of the saved layout.
   ═══════════════════════════════════════════════════════════════════════ */
(() => {
  'use strict';

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const INTERVALS = [
    { id: '1', label: '1m' }, { id: '5', label: '5m' }, { id: '15', label: '15m' },
    { id: '30', label: '30m' }, { id: '60', label: '1H' }, { id: '240', label: '4H' },
    { id: 'D', label: '1D' }, { id: 'W', label: '1W' }, { id: 'M', label: '1M' },
  ];

  const DEFAULT_SYMBOLS = ['NASDAQ:AAPL', 'NASDAQ:NVDA', 'NASDAQ:TSLA',
                           'AMEX:SPY', 'NASDAQ:MSFT', 'BINANCE:BTCUSDT'];

  const state = {
    layout: '1',
    active: 0,
    cells: [],
    interval: '15',
    style: '1',                  // 1 = candles
    theme: 'dark',
    timezone: 'America/New_York',
    hideSideToolbar: false,
    withVolume: true,
  };

  const STORE = {
    get(k, d) { try { const v = localStorage.getItem('tc2:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('tc2:' + k, JSON.stringify(v)); } catch {} },
  };

  /* ══ Symbols ═════════════════════════════════════════════════════
     TradingView wants EXCHANGE:TICKER but resolves a bare ticker too. A
     small map covers the names typed most often, so the right exchange is
     used instead of whatever TradingView would guess. */
  const EXCHANGE_HINTS = {
    AAPL: 'NASDAQ', MSFT: 'NASDAQ', NVDA: 'NASDAQ', TSLA: 'NASDAQ', AMZN: 'NASDAQ',
    META: 'NASDAQ', GOOGL: 'NASDAQ', GOOG: 'NASDAQ', AVGO: 'NASDAQ', NFLX: 'NASDAQ',
    AMD: 'NASDAQ', COIN: 'NASDAQ', MSTR: 'NASDAQ', PLTR: 'NASDAQ', HOOD: 'NASDAQ',
    RIVN: 'NASDAQ', SOFI: 'NASDAQ', ADBE: 'NASDAQ', QQQ: 'NASDAQ', TLT: 'NASDAQ',
    GME: 'NYSE', JPM: 'NYSE', V: 'NYSE', MA: 'NYSE', UNH: 'NYSE', XOM: 'NYSE',
    CVX: 'NYSE', LLY: 'NYSE', JNJ: 'NYSE', WMT: 'NYSE', PG: 'NYSE', HD: 'NYSE',
    MRK: 'NYSE', KO: 'NYSE', DIS: 'NYSE', BA: 'NYSE', F: 'NYSE', T: 'NYSE',
    SPY: 'AMEX', IWM: 'AMEX', DIA: 'AMEX', GLD: 'AMEX', VIXY: 'AMEX',
  };
  const CRYPTO = {
    BTC: 'BINANCE:BTCUSDT', ETH: 'BINANCE:ETHUSDT', SOL: 'BINANCE:SOLUSDT',
    DOGE: 'BINANCE:DOGEUSDT', XRP: 'BINANCE:XRPUSDT', ADA: 'BINANCE:ADAUSDT',
  };
  const INDEX = { SPX: 'SP:SPX', NDX: 'NASDAQ:NDX', DJI: 'DJ:DJI', VIX: 'CBOE:VIX', RUT: 'RUSSELL:RUT' };

  function normalise(input) {
    let s = String(input || '').trim().toUpperCase().replace(/\s+/g, '');
    if (!s) return '';
    if (s.includes(':')) return s;                     // already qualified
    s = s.replace(/^[\^$]/, '');                       // ^SPX / $SPX
    if (INDEX[s]) return INDEX[s];
    if (CRYPTO[s]) return CRYPTO[s];
    const pair = /^([A-Z]{2,6})(?:-|\/)?(USD|USDT)$/.exec(s);
    if (pair) return CRYPTO[pair[1]] || `BINANCE:${pair[1]}USDT`;
    const hint = EXCHANGE_HINTS[s];
    return hint ? `${hint}:${s}` : s;                  // let TradingView resolve the rest
  }
  const shortName = sym => String(sym).split(':').pop();

  /* ══ Chart cells ═════════════════════════════════════════════════
     The embed exposes no method to change a symbol after construction, so a
     change tears the widget down and builds a new one. That is a full iframe
     load, which is why it only happens when the symbol actually differs. */
  function createCell(idx, symbol) {
    const el = document.createElement('section');
    el.className = 'cell';
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="cell-bar">
        <input class="sym-input" spellcheck="false" aria-label="Symbol">
        <span class="cell-hint"></span>
        <div class="spacer"></div>
        <button class="btn icon cell-search" title="Search symbol"><svg viewBox="0 0 16 16"><use href="#i-search"/></svg></button>
      </div>
      <div class="cell-chart"><div class="chart-mount"></div></div>`;

    const cell = {
      idx, el,
      symbol: symbol || DEFAULT_SYMBOLS[idx] || 'NASDAQ:AAPL',
      widget: null,
      els: { bar: $('.cell-bar', el), sym: $('.sym-input', el), hint: $('.cell-hint', el), mount: $('.chart-mount', el) },
    };

    cell.els.sym.value = shortName(cell.symbol);
    cell.els.sym.addEventListener('keydown', e => {
      if (e.key === 'Enter') { setSymbol(cell, cell.els.sym.value); cell.els.sym.blur(); }
      if (e.key === 'Escape') { cell.els.sym.value = shortName(cell.symbol); cell.els.sym.blur(); }
    });
    cell.els.sym.addEventListener('focus', () => cell.els.sym.select());
    $('.cell-search', el).addEventListener('click', () => { setActive(cell.idx); openSearch(); });
    el.addEventListener('pointerdown', () => setActive(cell.idx), true);
    return cell;
  }

  let mountSeq = 0;
  function mountWidget(cell) {
    if (!window.TradingView) return;
    // In a grid, the widget's own side rail and date-range footer eat most of
    // a small cell. A single chart gets the full furniture; tiles get the
    // chart. The Settings toggle can still force the drawing rail off.
    const multi = state.cells.length > 1;
    // Clearing first stops a stale chart flashing underneath the new one.
    cell.els.mount.innerHTML = '';
    const host = document.createElement('div');
    host.id = `tvm-${cell.idx}-${++mountSeq}`;
    host.style.height = '100%';
    cell.els.mount.append(host);
    cell.els.hint.textContent = '';

    try {
      cell.widget = new window.TradingView.widget({
        container_id: host.id,
        symbol: cell.symbol,
        interval: state.interval,
        autosize: true,
        timezone: state.timezone,
        theme: state.theme,
        style: state.style,
        locale: 'en',
        toolbar_bg: '#0B0E14',
        enable_publishing: false,
        allow_symbol_change: false,   // this app owns the symbol, so it can save it
        hide_side_toolbar: state.hideSideToolbar || multi,
        withdateranges: !multi,
        details: false,
        // The widget already overlays volume on the price pane, so adding the
        // study as well drew it twice. Only the hide flag is ours to set.
        hide_volume: !state.withVolume,
        overrides: {
          'paneProperties.background': '#0B0E14',
          'paneProperties.backgroundType': 'solid',
          'paneProperties.vertGridProperties.color': '#151C28',
          'paneProperties.horzGridProperties.color': '#151C28',
          'scalesProperties.textColor': '#7C8AA5',
          'scalesProperties.lineColor': '#212A3A',
          'mainSeriesProperties.candleStyle.upColor': '#2EBD85',
          'mainSeriesProperties.candleStyle.downColor': '#F0616D',
          'mainSeriesProperties.candleStyle.borderUpColor': '#2EBD85',
          'mainSeriesProperties.candleStyle.borderDownColor': '#F0616D',
          'mainSeriesProperties.candleStyle.wickUpColor': '#2EBD85',
          'mainSeriesProperties.candleStyle.wickDownColor': '#F0616D',
        },
      });
    } catch {
      cell.els.hint.textContent = 'chart failed to load';
    }
  }

  function setSymbol(cell, input, opts = {}) {
    if (!cell) return;
    const sym = normalise(input);
    if (!sym) { cell.els.sym.value = shortName(cell.symbol); return; }
    cell.els.sym.value = shortName(sym);
    if (sym === cell.symbol && cell.widget) return;     // nothing to rebuild
    cell.symbol = sym;
    mountWidget(cell);
    if (!opts.silent) saveLayout();
  }

  function destroyCell(cell) {
    try { cell.widget?.remove?.(); } catch {}
    cell.els.mount.innerHTML = '';
    cell.el.remove();
  }

  /* ══ Layout ══════════════════════════════════════════════════════ */
  const LAYOUT_COUNT = { '1': 1, '2': 2, '2v': 2, '3': 3, '4': 4, '6': 6 };

  function setLayout(id, opts = {}) {
    const want = LAYOUT_COUNT[id] || 1;
    const grid = $('#grid');
    state.layout = id;
    grid.dataset.layout = id;
    $$('#layouts .btn').forEach(b => b.classList.toggle('on', b.dataset.layout === id));

    const before = state.cells.length;
    while (state.cells.length > want) destroyCell(state.cells.pop());
    while (state.cells.length < want) {
      const cell = createCell(state.cells.length, (opts.symbols || [])[state.cells.length]);
      state.cells.push(cell);
      grid.append(cell.el);
    }
    state.cells.forEach((c, i) => { c.idx = i; c.el.dataset.idx = i; });
    // Mount only once every cell exists, so each widget knows whether it is
    // alone or in a grid. Crossing the 1-vs-many line changes the furniture,
    // so those widgets have to be rebuilt too.
    const crossed = (before <= 1) !== (want <= 1);
    state.cells.forEach(c => { if (!c.widget || crossed) mountWidget(c); });
    setActive(Math.min(state.active, state.cells.length - 1));
    if (!opts.skipSave) saveLayout();
  }

  function setActive(i) {
    state.active = clamp(i, 0, Math.max(0, state.cells.length - 1));
    state.cells.forEach((c, j) => c.el.classList.toggle('active', j === state.active));
  }
  const activeCell = () => state.cells[state.active];
  const remountAll = () => { state.cells.forEach(mountWidget); saveLayout(); };

  function saveLayout() {
    STORE.set('layout', {
      layout: state.layout, active: state.active,
      interval: state.interval, style: state.style, timezone: state.timezone,
      hideSideToolbar: state.hideSideToolbar, withVolume: state.withVolume,
      symbols: state.cells.map(c => c.symbol),
    });
  }

  function restoreLayout() {
    const s = STORE.get('layout', null);
    if (!s) { setLayout('1', { skipSave: true }); return; }
    state.interval = s.interval || '15';
    state.style = s.style || '1';
    state.timezone = s.timezone || 'America/New_York';
    state.hideSideToolbar = !!s.hideSideToolbar;
    state.withVolume = s.withVolume !== false;
    state.active = s.active || 0;
    setLayout(s.layout || '1', { symbols: s.symbols || [], skipSave: true });
  }

  /* ══ Panels ══════════════════════════════════════════════════════ */
  function openPanel(id) {
    const panel = $('#' + id);
    const wasOpen = panel.classList.contains('open');
    $$('.panel').forEach(p => p.classList.remove('open'));
    if (!wasOpen) panel.classList.add('open');
    return !wasOpen;
  }
  const closePanels = () => $$('.panel').forEach(p => p.classList.remove('open'));

  /* TradingView's other embeds are script tags that hydrate the div they sit
     in, so each is rebuilt by replacing its container. */
  function mountEmbed(container, widget, config) {
    container.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'tradingview-widget-container';
    wrap.style.height = '100%';
    const inner = document.createElement('div');
    inner.className = 'tradingview-widget-container__widget';
    inner.style.height = '100%';
    const script = document.createElement('script');
    script.type = 'text/javascript';
    script.async = true;
    script.src = `https://s3.tradingview.com/external-embedding/embed-widget-${widget}.js`;
    script.textContent = JSON.stringify(config);
    wrap.append(inner, script);
    container.append(wrap);
  }

  const screenerConfig = () => ({
    width: '100%', height: '100%', defaultColumn: 'overview', defaultScreen: 'most_capitalized',
    market: 'america', showToolbar: true, colorTheme: state.theme, locale: 'en', isTransparent: true,
  });
  const newsConfig = () => {
    const sym = activeCell()?.symbol;
    return {
      displayMode: 'regular', width: '100%', height: '100%',
      colorTheme: state.theme, locale: 'en', isTransparent: true,
      ...(sym ? { feedMode: 'symbol', symbol: sym } : { feedMode: 'market', market: 'stock' }),
    };
  };

  /* — watchlist — */
  let watchlist = [];
  function renderWatchlist() {
    const body = $('#watchlist-body');
    if (!watchlist.length) {
      body.innerHTML = '<div class="empty">No symbols yet.<br>Add one below to jump between them.</div>';
      return;
    }
    body.textContent = '';
    for (const sym of watchlist) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<div class="row-main"><div class="row-sym">${esc(shortName(sym))}</div>
          <div class="row-name">${esc(sym)}</div></div>
        <button class="row-del" title="Remove"><svg viewBox="0 0 16 16"><use href="#i-close"/></svg></button>`;
      row.addEventListener('click', e => {
        if (e.target.closest('.row-del')) {
          watchlist = watchlist.filter(x => x !== sym);
          STORE.set('watchlist', watchlist);
          renderWatchlist();
          return;
        }
        setSymbol(activeCell(), sym);
      });
      body.append(row);
    }
  }
  function addToWatchlist(input) {
    const sym = normalise(input);
    if (!sym) return;
    if (watchlist.includes(sym)) { toast(`${shortName(sym)} is already listed`); return; }
    watchlist.push(sym);
    STORE.set('watchlist', watchlist);
    renderWatchlist();
    toast(`${shortName(sym)} added`);
  }

  /* ══ Symbol search ═══════════════════════════════════════════════
     TradingView's own symbol-search endpoint, the one their widgets use. If
     it is unreachable the typed text still resolves, so the overlay never
     becomes a dead end. */
  let searchTimer = null, results = [], sel = 0;

  function openSearch() {
    $('#search-overlay').classList.add('open');
    const input = $('#search-input');
    input.value = ''; input.focus();
    results = []; sel = 0;
    $('#search-results').innerHTML = '<div class="empty">Type a ticker.</div>';
  }
  const closeSearch = () => $('#search-overlay').classList.remove('open');

  async function runSearch(q) {
    if (!q) { results = []; $('#search-results').innerHTML = '<div class="empty">Type a ticker.</div>'; return; }
    try {
      const r = await fetch('https://symbol-search.tradingview.com/symbol_search/?text='
        + encodeURIComponent(q) + '&hl=0&lang=en&type=&domain=production');
      if (!r.ok) throw new Error('unavailable');
      const rows = await r.json();
      const clean = s => String(s || '').replace(/<\/?em>/g, '');
      results = (rows || []).slice(0, 12).map(x => ({
        symbol: `${x.exchange}:${clean(x.symbol)}`,
        name: clean(x.description),
        exchange: x.exchange || '',
        type: x.type || '',
      }));
    } catch {
      // Fall back to the typed text so Enter still loads something sensible.
      results = [{ symbol: normalise(q), name: 'Use as typed', exchange: '', type: '' }];
    }
    sel = 0;
    renderResults();
  }

  function renderResults() {
    const box = $('#search-results');
    if (!results.length) { box.innerHTML = '<div class="empty">Nothing found.</div>'; return; }
    box.textContent = '';
    results.forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (i === sel ? ' sel' : '');
      row.innerHTML = `<div class="row-main"><div class="row-sym">${esc(shortName(r.symbol))}</div>
          <div class="row-name">${esc(r.name)}</div></div>
        <div class="row-right"><div class="row-name">${esc(r.exchange)}${r.type ? ' · ' + esc(r.type) : ''}</div></div>`;
      row.addEventListener('click', () => pick(i));
      box.append(row);
    });
  }

  function pick(i) {
    const r = results[i];
    if (!r) return;
    closeSearch();
    setSymbol(activeCell(), r.symbol);
  }

  /* ══ Settings ════════════════════════════════════════════════════ */
  const STYLES = [
    { id: '1', name: 'Candles' }, { id: '9', name: 'Hollow candles' }, { id: '0', name: 'Bars' },
    { id: '8', name: 'Heikin-Ashi' }, { id: '2', name: 'Line' }, { id: '3', name: 'Area' },
    { id: '4', name: 'Renko' }, { id: '7', name: 'Line break' },
  ];
  const ZONES = ['America/New_York', 'America/Chicago', 'America/Los_Angeles', 'Europe/London',
    'Europe/Berlin', 'Asia/Tokyo', 'Asia/Hong_Kong', 'Australia/Sydney', 'Etc/UTC'];

  function openSettings() {
    openPanel('panel-settings');
    const body = $('#settings-body');
    body.textContent = '';
    const group = t => { const h = document.createElement('div'); h.className = 'label group-label'; h.textContent = t; body.append(h); };
    const select = (label, value, options, onChange) => {
      const row = document.createElement('div'); row.className = 'setting';
      const l = document.createElement('label'); l.textContent = label;
      const s = document.createElement('select'); s.className = 'field'; s.style.width = '150px';
      for (const o of options) { const opt = document.createElement('option'); opt.value = o.id; opt.textContent = o.name; s.append(opt); }
      s.value = value;
      s.addEventListener('change', () => onChange(s.value));
      row.append(l, s); body.append(row);
    };
    const toggle = (label, value, hint, onChange) => {
      const row = document.createElement('div'); row.className = 'setting';
      const l = document.createElement('label');
      l.innerHTML = `${esc(label)}${hint ? `<div style="font-size:11px;color:var(--dim)">${esc(hint)}</div>` : ''}`;
      const b = document.createElement('button');
      b.className = 'btn' + (value ? ' on' : ''); b.textContent = value ? 'On' : 'Off';
      b.addEventListener('click', () => { onChange(!value); openSettings(); });
      row.append(l, b); body.append(row);
    };

    group('Charts');
    select('Interval', state.interval, INTERVALS.map(i => ({ id: i.id, name: i.label })),
      v => { state.interval = v; remountAll(); });
    select('Candle type', state.style, STYLES, v => { state.style = v; remountAll(); });
    select('Time zone', state.timezone, ZONES.map(z => ({ id: z, name: z.replace(/_/g, ' ') })),
      v => { state.timezone = v; remountAll(); });
    select('Theme', state.theme, [{ id: 'dark', name: 'Dark' }, { id: 'light', name: 'Light' }],
      v => { state.theme = v; document.body.dataset.theme = v; remountAll(); });
    toggle('Volume', state.withVolume, 'Show the volume study on every chart.',
      v => { state.withVolume = v; remountAll(); });
    toggle('Drawing toolbar', !state.hideSideToolbar, "TradingView's drawing tools down the left of each chart.",
      v => { state.hideSideToolbar = !v; remountAll(); });

    group('About the data');
    const note = document.createElement('div');
    note.className = 'empty'; note.style.textAlign = 'left';
    note.innerHTML = `Charts, prices and indicators are TradingView's, shown through their
      embedded widget. For US equities the free widget carries <b>Cboe One</b> — a single-venue
      feed, roughly a tenth of consolidated volume — so figures match a free TradingView
      account rather than the full tape. Signing in to TradingView in this browser applies
      whatever data you are entitled to.
      <div style="margin-top:8px">Interval, indicators and drawings changed <i>inside</i> a chart
      belong to TradingView and are not part of the saved layout. Symbols set from here are.</div>`;
    body.append(note);

    const reset = document.createElement('div'); reset.className = 'setting';
    const rb = document.createElement('button');
    rb.className = 'btn'; rb.textContent = 'Reset workspace'; rb.style.color = 'var(--down)';
    rb.addEventListener('click', () => {
      if (!confirm('Reset layout, watchlist and settings?')) return;
      try { Object.keys(localStorage).filter(k => k.startsWith('tc2:')).forEach(k => localStorage.removeItem(k)); } catch {}
      location.reload();
    });
    reset.append(rb); body.append(reset);
  }

  /* ══ Misc ════════════════════════════════════════════════════════ */
  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = msg;
    $('#toasts').append(el);
    setTimeout(() => el.remove(), kind === 'error' ? 4000 : 2000);
  }

  /* ══ Wiring ══════════════════════════════════════════════════════ */
  function wire() {
    $('#layouts').addEventListener('click', e => {
      const b = e.target.closest('[data-layout]');
      if (b) setLayout(b.dataset.layout);
    });
    $('#btn-search').addEventListener('click', openSearch);
    $('#btn-sync').addEventListener('click', () => {
      const sym = activeCell()?.symbol;
      if (!sym) return;
      state.cells.forEach(c => setSymbol(c, sym, { silent: true }));
      saveLayout();
      toast(`All charts on ${shortName(sym)}`);
    });
    $('#btn-watchlist').addEventListener('click', () => { if (openPanel('panel-watchlist')) renderWatchlist(); });
    $('#btn-screener').addEventListener('click', () => { if (openPanel('panel-screener')) mountEmbed($('#screener-body'), 'screener', screenerConfig()); });
    $('#btn-news').addEventListener('click', () => { if (openPanel('panel-news')) mountEmbed($('#news-body'), 'timeline', newsConfig()); });
    $('#btn-settings').addEventListener('click', openSettings);
    $$('[data-close-panel]').forEach(b => b.addEventListener('click', closePanels));

    $('#watchlist-add-btn').addEventListener('click', () => {
      addToWatchlist($('#watchlist-add').value); $('#watchlist-add').value = '';
    });
    $('#watchlist-add').addEventListener('keydown', e => {
      if (e.key === 'Enter') { addToWatchlist(e.target.value); e.target.value = ''; }
    });

    const input = $('#search-input');
    input.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = input.value.trim();
      searchTimer = setTimeout(() => runSearch(q), 200);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, results.length - 1); renderResults(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); renderResults(); e.preventDefault(); }
      else if (e.key === 'Enter') {
        if (results.length) pick(sel);
        else { closeSearch(); setSymbol(activeCell(), input.value); }
      }
    });
    $('#search-overlay').addEventListener('click', e => { if (e.target.id === 'search-overlay') closeSearch(); });

    document.addEventListener('keydown', e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      if (e.key === 'Escape') {
        if ($('#search-overlay').classList.contains('open')) closeSearch(); else closePanels();
        return;
      }
      if (typing) return;
      if (e.key === '/') { e.preventDefault(); openSearch(); }
      else if (e.key >= '1' && e.key <= '6' && !e.metaKey && !e.ctrlKey) {
        setLayout(['1', '2', '2v', '3', '4', '6'][+e.key - 1]);
      } else if (e.key.toLowerCase() === 'w') { if (openPanel('panel-watchlist')) renderWatchlist(); }
      else if (e.key.toLowerCase() === 's') { if (openPanel('panel-screener')) mountEmbed($('#screener-body'), 'screener', screenerConfig()); }
      else if (e.key.toLowerCase() === 'n') { if (openPanel('panel-news')) mountEmbed($('#news-body'), 'timeline', newsConfig()); }
    });
  }

  /* ══ Boot ════════════════════════════════════════════════════════ */
  function boot() {
    if (!window.TradingView) {
      $('#grid').innerHTML = '<div class="empty" style="padding-top:18vh">'
        + "TradingView's chart library could not load.<br>Check your connection, or any extension "
        + 'blocking tradingview.com, and reload.</div>';
      return;
    }
    document.body.dataset.theme = state.theme;
    watchlist = STORE.get('watchlist', ['NASDAQ:AAPL', 'NASDAQ:NVDA', 'NASDAQ:TSLA', 'AMEX:SPY']);
    wire();
    restoreLayout();
  }

  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
