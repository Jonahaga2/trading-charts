  <g id="i-star"><path d="M8 2l1.9 3.9 4.1.6-3 2.9.7 4.1L8 11.6 4.3 13.5l.7-4.1-3-2.9 4.1-.6z"/></g>
  <g id="i-radar"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.5"/><path d="M8 8l4-4"/></g>
  <g id="i-news"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M4.5 6h5M4.5 8.5h7M4.5 11h4"/></g>

  <g id="i-sync"><path d="M13 7a5 5 0 0 0-9-2M3 9a5 5 0 0 0 9 2"/><path d="M3.5 3v3h3M12.5 13v-3h-3"/></g>

  <g id="i-l1"><rect x="2" y="3" width="12" height="10" rx="1"/></g>
  <g id="i-l2"><rect x="2" y="3" width="5.2" height="10" rx="1"/><rect x="8.8" y="3" width="5.2" height="10" rx="1"/></g>

<!-- ═══ Header ═════════════════════════════════════════════════════ -->
<header id="header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="8" y="11" width="4" height="13" fill="#2EBD85"/><rect x="9.2" y="7" width="1.6" height="19" fill="#2EBD85"/>
      <rect x="19" y="8" width="4" height="11" fill="#F0616D"/><rect x="20.2" y="5" width="1.6" height="18" fill="#F0616D"/>
    </svg>
    <span class="brand-name">Trading Charts</span>
  </div>

  <div class="layouts" id="layouts" role="group" aria-label="Grid layout">
    <button class="btn on" data-layout="1"  title="Single chart"><svg viewBox="0 0 16 16"><use href="#i-l1"/></svg></button>
    <button class="btn"    data-layout="2"  title="Two columns"><svg viewBox="0 0 16 16"><use href="#i-l2"/></svg></button>
    <button class="btn"    data-layout="2v" title="Two rows"><svg viewBox="0 0 16 16"><use href="#i-l2v"/></svg></button>
    <button class="btn"    data-layout="3"  title="Three charts"><svg viewBox="0 0 16 16"><use href="#i-l3"/></svg></button>
    <button class="btn"    data-layout="4"  title="Four charts"><svg viewBox="0 0 16 16"><use href="#i-l4"/></svg></button>
    <button class="btn"    data-layout="6"  title="Six charts"><svg viewBox="0 0 16 16"><use href="#i-l6"/></svg></button>
    <button class="btn"    data-layout="9"  title="Nine charts"><svg viewBox="0 0 16 16"><use href="#i-l9"/></svg></button>
  </div>

  <div class="sep"></div>
  <button class="btn" id="btn-search"><svg viewBox="0 0 16 16"><use href="#i-search"/></svg><span>Symbol</span><kbd>/</kbd></button>
  <button class="btn" id="btn-sync" title="Put the active symbol on every chart"><svg viewBox="0 0 16 16"><use href="#i-sync"/></svg><span>Sync all</span></button>
  <button class="btn" id="btn-studies" title="Indicators on every chart"><svg viewBox="0 0 16 16"><use href="#i-fx"/></svg><span>Indicators</span><span class="count" id="studies-count" hidden></span></button>

  <div class="spacer"></div>

  <button class="btn icon" id="btn-watchlist" title="Watchlist"><svg viewBox="0 0 16 16"><use href="#i-star"/></svg></button>
  <button class="btn icon" id="btn-screener"  title="Screener"><svg viewBox="0 0 16 16"><use href="#i-radar"/></svg></button>
  <button class="btn icon" id="btn-news"      title="News"><svg viewBox="0 0 16 16"><use href="#i-news"/></svg></button>
  <button class="btn icon" id="btn-settings"  title="Settings"><svg viewBox="0 0 16 16"><use href="#i-gear"/></svg></button>
</header>

<!-- ═══ Charts ═════════════════════════════════════════════════════ -->
<main id="grid" data-layout="1"></main>

<!-- ═══ Panels ═════════════════════════════════════════════════════ -->
<div id="panel-layer">
  <aside class="panel" id="panel-watchlist" aria-label="Watchlist">
    <div class="panel-head">
      <span class="panel-title">Watchlist</span>
      <button class="btn icon" data-close-panel><svg viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
    </div>
    <div class="panel-body" id="watchlist-body"></div>
    <div class="panel-foot">
      <input class="field" id="watchlist-add" placeholder="Add symbol" spellcheck="false" style="flex:1">
      <button class="btn" id="watchlist-add-btn"><svg viewBox="0 0 16 16"><use href="#i-plus"/></svg></button>
    </div>
  </aside>

  <aside class="panel" id="panel-studies" aria-label="Indicators">
    <div class="panel-head">
      <span class="panel-title">Indicators</span>
      <button class="btn" id="studies-clear">Clear</button>
      <button class="btn icon" data-close-panel><svg viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
    </div>
    <div class="panel-note">Whatever you pick here is drawn on <b>every</b> chart at once.</div>
    <div class="panel-sub">
      <input class="field" id="studies-filter" placeholder="Filter indicators" spellcheck="false" style="flex:1">
    </div>
    <div class="panel-body" id="studies-body"></div>
  </aside>

  <aside class="panel wide" id="panel-screener" aria-label="Screener">
    <div class="panel-head">
      <span class="panel-title">Screener</span>
      <button class="btn icon" data-close-panel><svg viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
    </div>
    <div class="panel-body embed" id="screener-body"></div>
  </aside>

  <aside class="panel" id="panel-news" aria-label="News">
    <div class="panel-head">
      <span class="panel-title">News</span>
      <button class="btn icon" data-close-panel><svg viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
    </div>
    <div class="panel-body embed" id="news-body"></div>
  </aside>

  <aside class="panel" id="panel-settings" aria-label="Settings">
    <div class="panel-head">
      <span class="panel-title">Settings</span>
      <button class="btn icon" data-close-panel><svg viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
    </div>
    <div class="panel-body" id="settings-body"></div>
  </aside>
</div>

<!-- ═══ Symbol search ══════════════════════════════════════════════ -->
<div id="search-overlay" role="dialog" aria-modal="true" aria-label="Symbol search">
  <div class="search-box">
    <input id="search-input" placeholder="Symbol — AAPL, NASDAQ:TSLA, BINANCE:BTCUSDT" autocomplete="off" spellcheck="false">
    <div class="search-results" id="search-results"></div>
    <div class="search-hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> pick</span><span><kbd>⏎</kbd> load</span><span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
